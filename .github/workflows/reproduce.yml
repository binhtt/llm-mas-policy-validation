name: Reproduce reported execution
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python run.py --out results/reproduced
      - run: python verify_reproduction.py
      - run: python run_integration.py
      - run: diff -u results/integration/runs.csv results/integration_reproduced/runs.csv
      - run: python compare_suites.py
      - run: diff -u results/comparison/runs.csv results/comparison_reproduced/runs.csv
